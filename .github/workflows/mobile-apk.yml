# Builds the HaulMate Android app on GitHub's servers (fast network, SDKs preinstalled)
# so the PC doesn't have to download hundreds of MB of Android/Gradle dependencies.
#
# Runs automatically when anything in mobile/ is pushed, or manually:
#   GitHub repo > Actions > "Mobile APK" > Run workflow  (optionally set the API address)
# Download the result: open the finished run > Artifacts > HaulMate-apk
name: Mobile APK

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Server the app talks to"
        default: "https://cherai.nexigent-labs.co.zw"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ios folders if they are not committed
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --org zw.haulmate --project-name haulmate_app --platforms android .
            cp platform_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          API="${{ github.event.inputs.api_base }}"
          [ -z "$API" ] && API="https://cherai.nexigent-labs.co.zw"
          flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE="$API"

      - uses: actions/upload-artifact@v4
        with:
          name: HaulMate-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
